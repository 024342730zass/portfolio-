<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience - My Portfolio</title>
    <link rel="stylesheet" href="styles.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ==================================================== */
        /* 0. DISCORD COLOR PALETTE & GLOBAL VARS */
        /* ==================================================== */
        :root {
            --discord-bg-primary: #36393f; 
            --discord-bg-secondary: #2f3136; 
            --discord-bg-tertiary: #202225; 
            --discord-blur-bg: rgba(47, 49, 54, 0.75);
            --discord-text-normal: #dcddde;
            --discord-text-muted: #b9bbbe; 
            --brand-color-blurple: #5865f2; 
            --brand-color-green: #3ba55d; 
        }

        /* ---------------------------------------------------- */
        /* 1. Global Setup & Background */
        /* ---------------------------------------------------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.2s, color 0.2s;
        }
        
        /* ⭐ เพิ่ม: สไตล์พื้นฐานของ body/html และพื้นหลัง ⭐ */
        body, html {
            min-height: 100vh;
            font-family: 'Inter', 'Noto Sans Thai', sans-serif;
            color: var(--discord-text-normal);
           
            overflow-x: hidden;
        }

        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.75; 
            filter: brightness(0.7);
        }
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

      
        .discord-navbar {
            /* 🌟 FIXED POSITION ที่ถูกต้อง 🌟 */
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            display: flex;
            justify-content: center;
            padding: 8px 12px;
            border-radius: 20px;
            
            /* Mica/Blur Effect */
            background-color: var(--discord-blur-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            z-index: 100;
            
            /* Animation */
            opacity: 0; 
            animation: fadeInSlideDown 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.1s forwards;
        }

        .nav-item {
            color: var(--discord-text-muted);
            font-weight: 500;
            padding: 10px 18px;
            font-size: 1.1rem;
            margin: 0 2px;
            border-radius: 16px;
            text-decoration: none;
            transition: background-color 0.2s, color 0.2s;
        }
        
        .nav-item:hover {
            background-color: var(--discord-bg-secondary);
            color: var(--discord-text-normal);
        }
        
        .nav-item.active {
            background-color: var(--discord-bg-tertiary);
            color: var(--discord-text-normal);
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2);
        }

        /* ---------------------------------------------------- */
        /* 3. EXPERIENCE & EDUCATION STYLES (เพิ่มสไตล์ Timeline) */
        /* ---------------------------------------------------- */

        #experience-education {
            padding: 20px 0 100px;
        }

        .exp-edu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 คอลัมน์ */
            gap: 40px;
        }

        .exp-edu-column h2 {
            font-size: 2.5rem;
            color: var(--brand-color-blurple);
            margin-bottom: 30px;
            border-bottom: 3px solid var(--discord-bg-primary);
            padding-bottom: 10px;
            margin-left: 38px
        }

        /* Timeline Styles */
        .timeline {
            position: relative;
            margin-left: 20px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background-color: var(--discord-bg-secondary);
        }

        .timeline-item {
            background-color: var(--discord-bg-secondary);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--discord-bg-primary);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -32px; 
            top: 25px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: var(--brand-color-blurple);
            border: 3px solid var(--discord-bg-tertiary);
        }
        
        .education-timeline .timeline-item::before {
             background-color: var(--brand-color-green); 
        }

        .timeline-item h3 {
            color: var(--discord-text-normal);
            margin-bottom: 5px;
            font-size: 1.3rem;
        }

        .timeline-item .date {
            color: var(--discord-text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .timeline-item p {
            color: var(--discord-text-muted);
            font-size: 1rem;
            line-height: 1.5;
        }
 
        /* ---------------------------------------------------- */
        /* 4. Responsive Design */
        /* ---------------------------------------------------- */
        @media (max-width: 768px) {
            .window-wrapper {
                 padding-top: 100px;
            }
            .exp-edu-grid {
                grid-template-columns: 1fr; 
                gap: 20px;
            }
            .exp-edu-column h2 {
                 text-align: center;
            }
            .timeline {
                 margin-left: 0;
                 padding-left: 20px;
            }
            .timeline-item::before {
                left: 8px;
            }
        }
    </style>
</head>

<body>

                    <div class="exp-edu-column">

                            </div>
                        </div>
                    </div>

    </div> </body>
